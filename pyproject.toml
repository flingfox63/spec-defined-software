[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sds-cli"
dynamic = ["version"]
description = "SDS (Spec-Defined Software) Command Line Tool & Verification Harness"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Advanced Agentic Coding Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Keep core cli standard-library-only to ensure zero dependencies.
    # Optional dependencies can be defined for advanced features.
]

[project.optional-dependencies]
mcp = ["mcp>=0.1.0"]  # Optional dependency for running as an MCP Server

[project.scripts]
sds = "sds.cli:main"

[tool.hatch.version]
path = "skills/sds-core/src/sds/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["skills/sds-core/src/sds"]

[tool.hatch.build.targets.wheel.force-include]
"skills/sds-core/SKILL.md" = "sds/_skill/sds/SKILL.md"
"skills/sds-core/templates" = "sds/_skill/sds/templates"
"references" = "sds/_skill/sds/references"
